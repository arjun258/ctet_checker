name: Deploy OMR Checker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: /home/mediaserver/omrchecker/OMRChecker  # ← set working dir

    steps:
      - name: pull latest code
        run: git pull origin main

      - name: restart systemctl service
        run: sudo systemctl restart ctet  # ← your command here

